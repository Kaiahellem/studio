<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logg inn i kundeportalen</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f5f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1b1a17;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f0;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:40px 32px;">
                <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:28px;line-height:1.2;">
                  Logg inn i kundeportalen
                </h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#5d5a53;">
                  Trykk på knappen for å logge inn. Lenken gjelder i én time.
                </p>
                <p style="margin:0 0 32px;">
                  <!-- RedirectTo already contains ?next=…, see requestLogin in src/features/auth/actions.ts -->
                  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}"
                     style="display:inline-block;background:#2c4a3e;color:#ffffff;text-decoration:none;font-size:16px;font-weight:600;padding:14px 28px;border-radius:6px;">
                    Logg inn
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:16px;line-height:1.6;color:#5d5a53;">
                  Eller skriv inn denne koden:
                </p>
                <p style="margin:0 0 32px;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:32px;letter-spacing:8px;">
                  {{ .Token }}
                </p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#5d5a53;">
                  Ba du ikke om å logge inn? Da kan du se bort fra denne e-posten.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
